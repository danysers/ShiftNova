name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --runInBand
      - run: npm run lint
      - run: npm run build:dist
      - uses: actions/upload-artifact@v4
        with:
          name: shiftnova-builds
          path: |
            build/release/chrome-mv3
            build/release/firefox
          if-no-files-found: error
