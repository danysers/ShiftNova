name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec jest --config=tests/unit/jest.config.mjs --runInBand
      - run: pnpm run lint
      - run: pnpm run build:dist
      - uses: actions/upload-artifact@v7
        with:
          name: shiftnova-builds
          path: |
            build/release/chrome-mv3
            build/release/firefox
          if-no-files-found: error
