name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shiftnova-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verificar versión de la etiqueta
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"
      - run: pnpm run test:unit -- --runInBand
      - run: pnpm run lint
      - run: pnpm run build:dist
      - name: Empaquetar Chromium
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist pages
          (cd build/release/chrome-mv3 && zip -qr "../../../dist/shiftnova-chromium-${VERSION}.zip" .)
      - name: Firmar Firefox como distribución no listada
        shell: bash
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          test -n "$WEB_EXT_API_KEY"
          test -n "$WEB_EXT_API_SECRET"
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm dlx web-ext sign \
            --source-dir build/release/firefox \
            --artifacts-dir dist \
            --channel unlisted \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"
          XPI="$(find dist -maxdepth 1 -name '*.xpi' -print -quit)"
          test -n "$XPI"
          mv "$XPI" "dist/shiftnova-firefox-${VERSION}.xpi"
      - name: Crear manifiestos y checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_BASE="https://github.com/danysers/ShiftNova/releases/download/${GITHUB_REF_NAME}"
          RELEASE_URL="https://github.com/danysers/ShiftNova/releases/tag/${GITHUB_REF_NAME}"
          FIREFOX_FILE="shiftnova-firefox-${VERSION}.xpi"
          CHROMIUM_FILE="shiftnova-chromium-${VERSION}.zip"
          FIREFOX_HASH="$(sha256sum "dist/${FIREFOX_FILE}" | cut -d' ' -f1)"
          (cd dist && sha256sum "${CHROMIUM_FILE}" "${FIREFOX_FILE}" > SHA256SUMS.txt)
          VERSION="$VERSION" RELEASE_URL="$RELEASE_URL" RELEASE_BASE="$RELEASE_BASE" CHROMIUM_FILE="$CHROMIUM_FILE" FIREFOX_FILE="$FIREFOX_FILE" FIREFOX_HASH="$FIREFOX_HASH" node -e "const fs=require('fs'); fs.writeFileSync('pages/latest.json', JSON.stringify({version:process.env.VERSION,releaseURL:process.env.RELEASE_URL,chromiumURL:process.env.RELEASE_BASE+'/'+process.env.CHROMIUM_FILE,firefoxURL:process.env.RELEASE_BASE+'/'+process.env.FIREFOX_FILE,publishedAt:new Date().toISOString()},null,2)+'\n'); const id='shiftnova@danysers.github.io'; fs.writeFileSync('pages/updates.json', JSON.stringify({addons:{[id]:{updates:[{version:process.env.VERSION,update_link:process.env.RELEASE_BASE+'/'+process.env.FIREFOX_FILE,update_hash:'sha256:'+process.env.FIREFOX_HASH}]}}},null,2)+'\n')"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.xpi
            dist/SHA256SUMS.txt
            pages/latest.json
            pages/updates.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: pages
        uses: actions/deploy-pages@v4
